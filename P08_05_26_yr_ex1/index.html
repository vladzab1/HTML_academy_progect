<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <h1>Contact form</h1>
    <h4>Please fill in your information and we'll be sending your order.</h4>

    <!-- Your name -->
    <div>
      <span>Your name</span>
      <div class="fields">
        <input type="text" placeholder="first name" id="first_name">
        <input type="text" placeholder="last name"  id="last_name">
      </div>
    </div>

    <!-- Your email -->
    <div>
      <span>Your email</span>
      <input type="email" placeholder="your_mail@mail.com" id="email">
    </div>

    <!-- Phone -->
    <div>
      <span>Phone *</span>
      <div class="fields">
        <input type="tel" placeholder="000" id="tel_first">
        <input type="tel" placeholder="000" id="tel_second">
        <input type="tel" placeholder="0000" id="tel_third">
      </div>
    </div>

    <!-- Message subject -->
    <div>
      <span>Message subject *</span>
      <select>
        <option>Other</option>
        <option>Suggestion to improve</option>
        <option>Problem</option>
      </select>
    </div>

    <!-- Message -->
    <div>
      <span>Message *</span>
      <textarea id="message"></textarea>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Submit -->
    <div class="submit-row">
      <input type="submit" id="submit" value="SUBMIT FORM">
    </div>
  </div>

</body>
</html>

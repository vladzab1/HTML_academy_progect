<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
  <h1>Contact form</h1>
  <h4>Please fill your information and we'll be sending your order</h4>
  <div class="row">Your name <input type="text" name="first name" placeholder="first name" id="first_name"> <input type="text" name="last name" placeholder="last name" id="last_name"></div>
  <div class="row">Your email <input type="email" name="email" placeholder="your_mail@mail.com" id="email"></div>
  <div class="row">Phone * <input type="tel" name="tel" placeholder="000" id="tel_first"> <input type="tel" name="tel" placeholder="000" id="tel_second"> <input type="tel" name="tel" placeholder="0000" id="tel_third"></div>
  <div class="row">Message subject *
    <select>
      <option>Other</option>
      <option>Suggestion to improve</option>
      <option>problem</option>
    </select></div>
  <div class="row">Message *
    <textarea name="message" id="message"></textarea>
  </div>
  <div class="row submit">
    <input type="submit" name="submit" id="submit" value="SUBMIT FORM">
  </div>
</div>
</body>
</html>

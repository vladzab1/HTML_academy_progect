<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>Tables</h1>

  <table>
    <caption>Hading</caption>
    <colgroup>
      <col class="firstCol">
      <col span="2" class="secondCol">
      <col span="1" class="thirdCol">
    </colgroup>
    <tbody>

    <tr>
      <th>One</th>
      <th>two</th>
      <th>Three</th>
      <th>Five</th>
    </tr>
    <tr>
      <td>00</td>
      <td>01</td>
      <td>02</td>
      <td>03</td>
    </tr>
    <tr>
      <td>10</td>
      <td>11</td>
      <td>12</td>
      <td>13</td>
    </tr>
    <tr>
      <td>20</td>
      <td>21</td>
      <td>22</td>
      <td>23</td>
    </tr>
    </tbody>
    <thead>
    <tr>
      <td>0</td>
      <td>0</td>
      <td>0</td>
      <td>0</td>
    </tr>
    </thead>
    <tfoot>
    <tr>
      <td>0</td>
      <td>0</td>
      <td>0</td>
      <td>0</td>
    </tr>

    </tfoot>
  </table>
   <div id="static">static</div>
   <div id="relative">relative</div>
   <div id="absolute">absolute</div>
   <div id ="fixed">fixed</div>
   <div id="sticky">sticky</div>
</body>
</html>
